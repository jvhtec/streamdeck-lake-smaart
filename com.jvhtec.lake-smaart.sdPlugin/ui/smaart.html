<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Smaart — Property Inspector</title>
  <link rel="stylesheet" href="sdpi.css">
</head>

<body>
  <div class="sdpi-wrapper">

    <div class="sdpi-heading">Smaart</div>
    <div class="sdpi-item-message">
      This action talks to the Smaart API over WebSocket.
    </div>

    <div class="sdpi-heading">Connection</div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Host</div>
      <input class="sdpi-item-value" type="text" id="smaartHost" onchange="saveGlobalSettings()">
    </div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Port</div>
      <input class="sdpi-item-value" type="number" id="smaartPort" onchange="saveGlobalSettings()">
    </div>

    <details>
      <summary class="sdpi-heading">Other Global Settings</summary>
      <div class="sdpi-item-message">Shared across all actions.</div>

      <div class="sdpi-item">
        <div class="sdpi-item-label">Lake Host</div>
        <input class="sdpi-item-value" type="text" id="lakeHost" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Lake Port</div>
        <input class="sdpi-item-value" type="number" id="lakePort" onchange="saveGlobalSettings()">
      </div>

      <div class="sdpi-item">
        <div class="sdpi-item-label">L-Acoustics Subnet</div>
        <input class="sdpi-item-value" type="text" id="laDiscoverySubnet" placeholder="192.168.0.0/24" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">L-Acoustics Hosts</div>
        <input class="sdpi-item-value" type="text" id="laDiscoveryHosts" placeholder="192.168.0.20,192.168.0.21" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">HTTP User</div>
        <input class="sdpi-item-value" type="text" id="laAuthUser" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">HTTP Pass</div>
        <input class="sdpi-item-value" type="password" id="laAuthPass" onchange="saveGlobalSettings()">
      </div>

      <div class="sdpi-heading">Tuning</div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Poll (ms)</div>
        <input class="sdpi-item-value" type="number" id="devicePollIntervalMs" placeholder="500" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Discovery (ms)</div>
        <input class="sdpi-item-value" type="number" id="deviceDiscoveryIntervalMs" placeholder="60000" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Preset poll (ms)</div>
        <input class="sdpi-item-value" type="number" id="presetPollIntervalMs" placeholder="1500" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">LA concurrency</div>
        <input class="sdpi-item-value" type="number" id="laMaxConcurrency" placeholder="10" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">LA timeout (ms)</div>
        <input class="sdpi-item-value" type="number" id="laRequestTimeoutMs" placeholder="1200" onchange="saveGlobalSettings()">
      </div>

    </details>

  </div>

  <script src="inspector.js"></script>
</body>

</html>
