<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Mute — Property Inspector</title>
  <link rel="stylesheet" href="sdpi.css">
</head>

<body>
  <div class="sdpi-wrapper">

    <div class="sdpi-heading">Target</div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Device</div>
      <select class="sdpi-item-value select" id="deviceId" onchange="saveSettings()"></select>
    </div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Target</div>
      <select class="sdpi-item-value select" id="targetId" onchange="saveSettings()"></select>
    </div>
    <div class="sdpi-item" id="noDevices" style="display:none;">
      <div class="sdpi-item-value">No devices found.</div>
    </div>
    <div class="sdpi-item">
      <button class="sdpi-item-value" type="button" onclick="refreshCatalog()">Refresh Devices</button>
    </div>

    <div class="sdpi-heading">Options</div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Momentary</div>
      <input class="sdpi-item-value" type="checkbox" id="momentary" onchange="saveSettings()">
    </div>

    <details>
      <summary class="sdpi-heading">Global Settings (shared)</summary>

      <div class="sdpi-item-message">These settings are shared across all actions.</div>

      <div class="sdpi-item">
        <div class="sdpi-item-label">Lake Host</div>
        <input class="sdpi-item-value" type="text" id="lakeHost" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Lake Port</div>
        <input class="sdpi-item-value" type="number" id="lakePort" min="1" max="65535" step="1" onchange="saveGlobalSettings()">
      </div>

      <div class="sdpi-item">
        <div class="sdpi-item-label">L-Acoustics Subnet</div>
        <input class="sdpi-item-value" type="text" id="laDiscoverySubnet" placeholder="192.168.0.0/24" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">L-Acoustics Hosts</div>
        <input class="sdpi-item-value" type="text" id="laDiscoveryHosts" placeholder="192.168.0.20,192.168.0.21" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">HTTP User</div>
        <input class="sdpi-item-value" type="text" id="laAuthUser" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">HTTP Pass</div>
        <input class="sdpi-item-value" type="password" id="laAuthPass" onchange="saveGlobalSettings()">
      </div>

      <div class="sdpi-heading">Tuning</div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Poll (ms)</div>
        <input class="sdpi-item-value" type="number" id="devicePollIntervalMs" placeholder="500" min="100" step="50" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Discovery (ms)</div>
        <input class="sdpi-item-value" type="number" id="deviceDiscoveryIntervalMs" placeholder="60000" min="1000" step="500" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">Preset poll (ms)</div>
        <input class="sdpi-item-value" type="number" id="presetPollIntervalMs" placeholder="1500" min="100" step="50" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">LA concurrency</div>
        <input class="sdpi-item-value" type="number" id="laMaxConcurrency" placeholder="10" min="1" step="1" onchange="saveGlobalSettings()">
      </div>
      <div class="sdpi-item">
        <div class="sdpi-item-label">LA timeout (ms)</div>
        <input class="sdpi-item-value" type="number" id="laRequestTimeoutMs" placeholder="1200" min="100" step="50" onchange="saveGlobalSettings()">
      </div>

    </details>

  </div>

  <script src="inspector.js"></script>
</body>

</html>
