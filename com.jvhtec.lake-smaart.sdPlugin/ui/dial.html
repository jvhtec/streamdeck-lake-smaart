<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Dial Property Inspector</title>
    <style>body{font-family:Arial,sans-serif;color:#ddd;background:#2d2d2d;margin:0;padding:10px}.sdpi-wrapper{display:flex;flex-direction:column;gap:8px}.sdpi-heading{font-size:12px;font-weight:700;text-transform:uppercase;color:#9aa0a6;margin-top:8px}.sdpi-item{display:flex;align-items:center;gap:8px}.sdpi-item-label{width:140px;font-size:12px;color:#cfcfcf}.sdpi-item-value{flex:1;min-height:28px;background:#3a3a3a;border:1px solid #555;color:#fff;border-radius:4px;padding:4px 6px}.sdpi-item-message{font-size:12px;color:#cfcfcf}button.sdpi-item-value{cursor:pointer}</style>
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-heading">Target</div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Target Device</div>
            <select class="sdpi-item-value select" id="targetDevice" onchange="saveSettings()">
                <option value="all">Auto (All)</option>
                <option value="lake">Lake</option>
                <option value="la_http">L-Acoustics</option>
            </select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Device</div>
            <select class="sdpi-item-value select" id="deviceId" onchange="saveSettings()"></select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Target</div>
            <select class="sdpi-item-value select" id="targetId" onchange="saveSettings()"></select>
        </div>
        <div class="sdpi-item" id="noDevices" style="display:none;">
            <div class="sdpi-item-value">No devices found.</div>
        </div>
        <div class="sdpi-item">
            <button class="sdpi-item-value" type="button" onclick="refreshCatalog()">Refresh Devices</button>
        </div>

        <div class="sdpi-heading">Level Options</div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Mode</div>
            <select class="sdpi-item-value select" id="levelMode" onchange="saveSettings()">
                <option value="gain">Gain (dB)</option>
                <option value="volume">Volume</option>
            </select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Step Size</div>
            <input class="sdpi-item-value" type="number" id="stepSize" onchange="saveSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Min</div>
            <input class="sdpi-item-value" type="number" id="minLevel" onchange="saveSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Max</div>
            <input class="sdpi-item-value" type="number" id="maxLevel" onchange="saveSettings()">
        </div>

        <div class="sdpi-heading">Global Discovery Settings</div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Lake Host</div>
            <input class="sdpi-item-value" type="text" id="lakeHost" onchange="saveGlobalSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Lake Port</div>
            <input class="sdpi-item-value" type="number" id="lakePort" onchange="saveGlobalSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">L-Acoustics Subnet</div>
            <input class="sdpi-item-value" type="text" id="laDiscoverySubnet" placeholder="192.168.0.0/24" onchange="saveGlobalSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">L-Acoustics Hosts</div>
            <input class="sdpi-item-value" type="text" id="laDiscoveryHosts" placeholder="192.168.0.20,192.168.0.21" onchange="saveGlobalSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">HTTP User</div>
            <input class="sdpi-item-value" type="text" id="laAuthUser" onchange="saveGlobalSettings()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">HTTP Pass</div>
            <input class="sdpi-item-value" type="password" id="laAuthPass" onchange="saveGlobalSettings()">
        </div>
    </div>
    <script>
let websocket = null;
let uuid = null;
let actionInfo = null;
let catalog = { devices: [], targets: [] };
let lastGlobalSettings = {};

function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
    uuid = inPropertyInspectorUUID;
    actionInfo = JSON.parse(inActionInfo);

    websocket = new WebSocket('ws://127.0.0.1:' + inPort);

    websocket.onopen = function () {
        websocket.send(JSON.stringify({
            event: inRegisterEvent,
            uuid: inPropertyInspectorUUID
        }));

        websocket.send(JSON.stringify({
            event: 'getGlobalSettings',
            context: uuid
        }));

        websocket.send(JSON.stringify({
            event: 'getSettings',
            context: actionInfo.context
        }));

        requestCatalog();
    };

    websocket.onmessage = function (evt) {
        const jsonObj = JSON.parse(evt.data);
        if (jsonObj.event === 'didReceiveGlobalSettings') {
            loadGlobalSettings(jsonObj.payload.settings || {});
        }
        if (jsonObj.event === 'didReceiveSettings') {
            loadSettings(jsonObj.payload.settings || {});
        }
        if (jsonObj.event === 'sendToPropertyInspector') {
            if (jsonObj.payload && jsonObj.payload.devices) {
                catalog = jsonObj.payload;
                updateSelectors();
            }
        }
    };
}

function loadSettings(settings) {
    const targetDevice = document.getElementById('targetDevice');
    if (targetDevice) {
        targetDevice.value = normalizeBackend(settings.targetDevice || 'all');
    }
    const inputs = document.querySelectorAll('.sdpi-item-value');
    inputs.forEach(input => {
        if (!input.id || ['lakeHost', 'lakePort', 'laDiscoverySubnet', 'laDiscoveryHosts', 'laAuthUser', 'laAuthPass'].includes(input.id)) {
            return;
        }
        if (input.type === 'checkbox') {
            input.checked = Boolean(settings[input.id]);
        } else {
            input.value = settings[input.id] ?? '';
        }
    });
    updateSelectors(settings.deviceId, settings.targetId);
    updateUI();
}

function loadGlobalSettings(settings) {
    lastGlobalSettings = Object.assign({}, settings);
    const fields = ['lakeHost', 'lakePort', 'laDiscoverySubnet', 'laDiscoveryHosts', 'laAuthUser', 'laAuthPass'];
    fields.forEach((field) => {
        const el = document.getElementById(field);
        if (el && settings[field] !== undefined) {
            el.value = settings[field];
        }
    });
}

function saveSettings() {
    if (!websocket) return;
    const settings = {};
    const inputs = document.querySelectorAll('.sdpi-item-value');
    inputs.forEach(input => {
        if (!input.id || ['lakeHost', 'lakePort', 'laDiscoverySubnet', 'laDiscoveryHosts', 'laAuthUser', 'laAuthPass'].includes(input.id)) {
            return;
        }
        if (input.type === 'checkbox') {
            settings[input.id] = input.checked;
        } else {
            settings[input.id] = input.value;
        }
    });
    settings.targetDevice = normalizeBackend(settings.targetDevice || 'all');
    const deviceSelect = document.getElementById('deviceId');
    const targetSelect = document.getElementById('targetId');
    if (deviceSelect) {
        settings.deviceId = deviceSelect.value || '';
    }
    if (targetSelect) {
        settings.targetId = targetSelect.value || '';
    }
    updateSelectors(settings.deviceId, settings.targetId);
    if (deviceSelect) {
        settings.deviceId = deviceSelect.value || '';
    }
    if (targetSelect) {
        settings.targetId = targetSelect.value || '';
    }

    websocket.send(JSON.stringify({
        event: 'setSettings',
        context: actionInfo.context,
        payload: settings
    }));

    updateSelectors(settings.deviceId, settings.targetId);
}

function saveGlobalSettings() {
    if (!websocket) return;
    const payload = Object.assign({}, lastGlobalSettings);
    const fields = ['lakeHost', 'lakePort', 'laDiscoverySubnet', 'laDiscoveryHosts', 'laAuthUser', 'laAuthPass'];
    fields.forEach((field) => {
        const el = document.getElementById(field);
        if (el) {
            payload[field] = el.value || '';
        }
    });

    websocket.send(JSON.stringify({
        event: 'setGlobalSettings',
        context: uuid,
        payload
    }));
}

function updateUI() {
    const action = actionInfo.action || '';
    const muteOptions = document.getElementById('muteOptions');
    const presetOptions = document.getElementById('presetOptions');
    const targetControls = document.getElementById('targetControls');
    const smaartControls = document.getElementById('smaartControls');

    if (muteOptions) {
        muteOptions.style.display = action.includes('mute') ? 'flex' : 'none';
    }
    if (presetOptions) {
        presetOptions.style.display = action.includes('preset') ? 'flex' : 'none';
    }
    if (targetControls && smaartControls) {
        const isSmaart = action.includes('smaart');
        targetControls.style.display = isSmaart ? 'none' : 'block';
        smaartControls.style.display = isSmaart ? 'block' : 'none';
    }
}

function requestCatalog() {
    if (!websocket) return;
    websocket.send(JSON.stringify({
        event: 'sendToPlugin',
        context: actionInfo.context,
        payload: { request: 'catalog' }
    }));
}

function refreshCatalog() {
    requestCatalog();
}

function normalizeBackend(value) {
    if (value === 'lacoustics') return 'la_http';
    if (value === 'lake' || value === 'la_http' || value === 'all') return value;
    return 'all';
}

function updateSelectors(selectedDeviceId, selectedTargetId) {
    const targetDeviceSelect = document.getElementById('targetDevice');
    const deviceSelect = document.getElementById('deviceId');
    const targetSelect = document.getElementById('targetId');
    const noDevices = document.getElementById('noDevices');
    if (!targetDeviceSelect || !deviceSelect || !targetSelect) return;
    const action = actionInfo.action || '';
    if (action.includes('smaart')) return;

    const selectedBackend = normalizeBackend(targetDeviceSelect.value || 'all');
    targetDeviceSelect.value = selectedBackend;
    const devices = catalog.devices || [];
    const targets = catalog.targets || [];
    const filteredDevices = selectedBackend === 'all'
        ? devices
        : devices.filter((device) => device.backend === selectedBackend);

    deviceSelect.innerHTML = '';
    filteredDevices.forEach((device) => {
        const option = document.createElement('option');
        option.value = device.id;
        option.textContent = device.name;
        deviceSelect.appendChild(option);
    });

    if (filteredDevices.length === 0) {
        if (noDevices) noDevices.style.display = 'flex';
        targetSelect.innerHTML = '';
        return;
    }

    if (noDevices) noDevices.style.display = 'none';

    const activeDevice = selectedDeviceId || deviceSelect.value || filteredDevices[0].id;
    deviceSelect.value = activeDevice;

    const filteredTargets = targets.filter((target) => {
        if (target.deviceId !== activeDevice) return false;
        if (action.includes('preset')) return target.kind === 'preset';
        if (action.includes('mute')) return target.supports && target.supports.includes('mute');
        return target.supports && (target.supports.includes('level') || target.supports.includes('volume'));
    });

    targetSelect.innerHTML = '';
    filteredTargets.forEach((target) => {
        const option = document.createElement('option');
        const id = target.backend === 'lake'
            ? `${target.backend}:${target.deviceId}:${target.kind}:${target.id}`
            : `${target.backend}:${target.deviceId}:${target.kind}:${target.index}`;
        option.value = id;
        option.textContent = target.name;
        targetSelect.appendChild(option);
    });

    if (selectedTargetId) {
        targetSelect.value = selectedTargetId;
    }
    if (!targetSelect.value && targetSelect.options.length > 0) {
        targetSelect.value = targetSelect.options[0].value;
    }
}

    </script>
</body>

</html>
